name: narrow_passage

map:
  origin: [0.0, 0.0]
  resolution: 0.2
  width: 100
  height: 80

vehicle:
  wheelbase: 2.8
  width: 1.8
  front_overhang: 1.0
  rear_overhang: 1.0
  max_steering_angle: 0.6

# 起点后轴中心，车头朝 +x。
start:
  x: 4.0
  y: 7.5
  theta: 0.0

# 目标后轴中心，车头朝 -x。
goal:
  x: 10.0
  y: 7.5
  theta: 3.141592653589793

# 调头后的目标停放区域，不作为障碍物。
parking_space:
  center: [8.6, 7.5]
  heading: 3.141592653589793
  length: 5.6
  width: 2.8

obstacles:
  # 下方障碍物，上边缘为 y=5。
  - vertices:
      - [0.0, 0.0]
      - [13.0, 0.0]
      - [13.0, 5.0]
      - [0.0, 5.0]

  # 上方障碍物，下边缘为 y=10。
  - vertices:
      - [0.0, 10.0]
      - [13.0, 10.0]
      - [13.0, 16.0]
      - [0.0, 16.0]